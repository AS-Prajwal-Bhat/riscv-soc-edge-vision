      <text x="1030" y="232">4096 x 32</text>
      <text x="1030" y="252">dual port</text>
      <text x="1030" y="388">61,706 int8</text>
      <text x="805" y="446">predicted digit</text>
    </g>
    <g stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#a)">
      <line x1="125" y1="126" x2="125" y2="188"/>
      <polyline points="220,222 260,222 260,282 298,282"/>
      <line x1="405" y1="192" x2="405" y2="248"/>
      <line x1="805" y1="94" x2="805" y2="128" marker-start="none"/>
      <line x1="912" y1="161" x2="978" y2="161"/>
      <line x1="912" y1="261" x2="978" y2="261"/>
    </g>
    <g stroke="#4ade80" stroke-width="2" fill="none">
      <polyline points="510,282 570,282 570,61"/>
