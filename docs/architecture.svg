      <path d="M0 0L10 5L0 10z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="1140" height="540" fill="#060d0a"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
