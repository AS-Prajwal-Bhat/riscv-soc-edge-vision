      <rect x="300" y="60" width="210" height="130" rx="10"/>
      <rect x="300" y="250" width="210" height="64" rx="10"/>
      <rect x="700" y="30" width="210" height="62" rx="10"/>
      <rect x="700" y="130" width="210" height="62" rx="10"/>
