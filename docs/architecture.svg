      <rect x="700" y="400" width="210" height="62" rx="10"/>
    </g>
    <g fill="#e6f5ec" font-size="16" font-weight="600">
      <text x="125" y="88">Host PC</text>
      <text x="125" y="218">UART peripheral</text>
      <text x="405" y="96">RV32I core</text>
      <text x="405" y="278">MMIO controller</text>
      <text x="805" y="56">Frame controller</text>
      <text x="805" y="156">DCT accelerator</text>
      <text x="805" y="256">CNN accelerator</text>
      <text x="1030" y="190">Shared</text>
      <text x="1030" y="210">BRAM</text>
      <text x="1030" y="366">Weight ROM</text>
      <text x="805" y="426">7-segment, LEDs</text>
    </g>
    <g fill="#7fa592" font-size="13">
